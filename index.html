            theme: {
                extend: {
                    fontFamily: {

                        brand: {

    <style>
        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden; /* Prevent horizontal scroll on mobile */
        }
        
        .roulette-container {
            position: relative;
            width: 100%;
            max-width: 320px; /* Max width for each roulette */
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        
        .pointer::after {
            content: '';
            position: absolute;
            top: -30px;
            left: -10px;
            width: 20px;
            height: 20px;
            background-color: #ff4757;
            border-radius: 50%;
        }

        .btn-spin {
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .btn-spin:active {
            transform: scale(0.95);
        }

        .result-card {
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .result-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Fun background elements */
        .bg-shape {
            position: fixed;
            z-index: -1;
            opacity: 0.4;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

        // Color Palettes for Wheels
        const colorPalette1 = ["#ff9ff3", "#feca57", "#ff6b6b", "#48dbfb", "#1dd1a1", "#5f27cd", "#c8d6e5", "#ff7f50"];
        const colorPalette2 = ["#55efc4", "#81ecec", "#74b9ff", "#a29bfe", "#ffeaa7", "#fab1a0", "#ff7675", "#fd79a8"];
        const colorPalette3 = ["#fbc531", "#e1b12c", "#4cd137", "#44bd32", "#00a8ff", "#0097e6", "#9c88ff", "#8c7ae6"];

        // Audio Context Setup (for synthesized sounds to avoid external resources)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playTickSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if(!audioCtx) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc1.type = 'sine';
            osc2.type = 'square';
            
            osc1.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
            osc1.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1); // C#5
            osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2); // E5
            osc1.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3); // A5

            osc2.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
            osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
            osc2.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.3);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.8);
            osc2.stop(audioCtx.currentTime + 0.8);
        }

        class Roulette {
            constructor(canvasId, data, colors, resultElementId, finalElementId, themeColorClass) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.data = data;
                this.colors = colors;
                this.resultEl = document.getElementById(resultElementId);
                this.finalEl = document.getElementById(finalElementId);
                this.themeColorClass = themeColorClass;
                
                this.numSegments = data.length;
                this.arc = Math.PI * 2 / this.numSegments;
                this.currentAngle = 0;
                this.isSpinning = false;
                this.spinTime = 0;
                this.spinTimeTotal = 0;
                this.spinSpeed = 0;
                
                // High DPI Canvas setup
                this.setupCanvas();
                this.draw();
                
                // Handle resize
                window.addEventListener('resize', () => {
                    this.setupCanvas();
                    this.draw();
                });
            }

            setupCanvas() {
                const container = this.canvas.parentElement;
                const size = container.clientWidth;
                const dpr = window.devicePixelRatio || 1;
                
                this.canvas.width = size * dpr;
                this.canvas.height = size * dpr;
                this.canvas.style.width = `${size}px`;
                this.canvas.style.height = `${size}px`;
                
                this.ctx.scale(dpr, dpr);
                this.centerX = size / 2;
                this.centerY = size / 2;
                this.radius = size / 2 - 10; // 10px padding
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                for (let i = 0; i < this.numSegments; i++) {
                    const angle = this.currentAngle + i * this.arc;
                    
                    // Draw segment
                    this.ctx.beginPath();
                    this.ctx.fillStyle = this.colors[i % this.colors.length];
                    this.ctx.moveTo(this.centerX, this.centerY);
                    this.ctx.arc(this.centerX, this.centerY, this.radius, angle, angle + this.arc, false);
                    this.ctx.lineTo(this.centerX, this.centerY);
                    this.ctx.fill();
                    
                    // Draw border
                    this.ctx.save();
                    this.ctx.strokeStyle = "rgba(255,255,255,0.5)";
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    this.ctx.restore();

                    // Draw text (numbers for visual simplicity, actual text in result)
                    this.ctx.save();
                    this.ctx.translate(this.centerX, this.centerY);
                    this.ctx.rotate(angle + this.arc / 2);
                    this.ctx.textAlign = "right";
                    this.ctx.fillStyle = "#fff";
                    this.ctx.font = `bold ${Math.max(12, this.radius * 0.1)}px 'Jua', sans-serif`;
                    // Add slight shadow to text
                    this.ctx.shadowColor = "rgba(0,0,0,0.5)";
                    this.ctx.shadowBlur = 4;
                    
                    // Just draw index number on the wheel to keep it clean, show full text on result
                    this.ctx.fillText((i + 1).toString(), this.radius - 15, 5);
                    this.ctx.restore();
                }
                
                // Draw center circle
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.radius * 0.15, 0, Math.PI * 2);
                this.ctx.fillStyle = "#ffffff";
                this.ctx.fill();
                this.ctx.lineWidth = 4;
                this.ctx.strokeStyle = "#dddddd";
                this.ctx.stroke();
                
                // Center dot
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.radius * 0.05, 0, Math.PI * 2);
                this.ctx.fillStyle = "#333333";
                this.ctx.fill();
            }

            spin() {
                if (this.isSpinning) return;
                initAudio(); // Initialize audio context on user interaction
                
                this.isSpinning = true;
                this.spinTime = 0;
                // Random spin time between 3 to 5 seconds
                this.spinTimeTotal = Math.random() * 2000 + 3000; 
                // Random initial speed
                this.spinSpeed = Math.random() * 0.2 + 0.3;
                
                this.resultEl.classList.remove('show', 'bg-white', 'text-gray-800');
                this.resultEl.classList.add('hidden');
                
                this.rotateWheel();
            }

            easeOut(t, b, c, d) {
                const ts = (t /= d) * t;
                const tc = ts * t;
                return b + c * (tc + -3 * ts + 3 * t);
            }

            rotateWheel() {
                this.spinTime += 20;
                if (this.spinTime >= this.spinTimeTotal) {
                    this.stopRotateWheel();
                    return;
                }
                
                // Easing function to slow down
                const spinAngle = this.spinSpeed - this.easeOut(this.spinTime, 0, this.spinSpeed, this.spinTimeTotal);
                this.currentAngle += spinAngle;
                
                // Tick sound logic (play sound roughly every segment pass)
                // In canvas, 270 degrees (Top) is -Math.PI/2
                // We calculate which segment is currently at the top
                let degrees = this.currentAngle * 180 / Math.PI + 90;
                let arcd = this.arc * 180 / Math.PI;
                let index = Math.floor((360 - degrees % 360) / arcd);
                
                if (this.lastIndex !== index) {
                    playTickSound();
                    this.lastIndex = index;
                }
                
                this.draw();
                requestAnimationFrame(() => this.rotateWheel());
            }

            stopRotateWheel() {
                this.isSpinning = false;
                playWinSound();
                
                // Calculate winning segment
                // Top pointer is at 270 degrees (-Math.PI/2)
                let degrees = this.currentAngle * 180 / Math.PI + 90;
                let arcd = this.arc * 180 / Math.PI;
                let index = Math.floor((360 - degrees % 360) / arcd);
                
                const resultText = this.data[index];
                
                // Show result locally
                this.resultEl.innerHTML = `<span class="text-2xl mb-1 block">🎉</span> ${resultText}`;
                this.resultEl.classList.remove('hidden');
                setTimeout(() => this.resultEl.classList.add('show'), 10);
                
                // Update final sentence area
                this.finalEl.textContent = resultText;
                this.finalEl.className = `px-4 py-3 bg-white rounded-xl font-bold shadow-md transform transition scale-105 border-4 ${this.themeColorClass}`;
                
                checkAllDone();
            }
        }

        let targetRoulette, objectRoulette, techRoulette;

        window.onload = function() {
            targetRoulette = new Roulette('canvas-target', targetCustomers, colorPalette1, 'result-target', 'final-target', 'border-red-400 text-red-600');
            objectRoulette = new Roulette('canvas-object', objectsAndFoods, colorPalette2, 'result-object', 'final-object', 'border-teal-400 text-teal-600');
            techRoulette = new Roulette('canvas-tech', futureTechs, colorPalette3, 'result-tech', 'final-tech', 'border-yellow-400 text-yellow-600');

            document.getElementById('btn-spin-target').addEventListener('click', () => targetRoulette.spin());
            document.getElementById('btn-spin-object').addEventListener('click', () => objectRoulette.spin());
            document.getElementById('btn-spin-tech').addEventListener('click', () => techRoulette.spin());
            
            document.getElementById('btn-celebrate').addEventListener('click', () => {
                shootConfetti();
                playWinSound();
            });
        };

        // Check if all 3 roulettes have been spun
        function checkAllDone() {
            const t1 = document.getElementById('final-target').textContent;
            const t2 = document.getElementById('final-object').textContent;
            const t3 = document.getElementById('final-tech').textContent;
            
            if (t1 !== '???' && t2 !== '???' && t3 !== '???') {
                const actionArea = document.getElementById('action-area');
                actionArea.classList.remove('hidden');
                actionArea.classList.add('animate-bounce-slow');
                setTimeout(shootConfetti, 500);
            }
        }

        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctxConfetti = confettiCanvas.getContext('2d');
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        });

        let confettis = [];
        const confettiColors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6b81'];

        class Confetti {
            constructor() {
                this.x = window.innerWidth / 2;
                this.y = window.innerHeight;
                this.vx = (Math.random() - 0.5) * 25; // x velocity
                this.vy = -(Math.random() * 15 + 15); // initial y velocity (up)
                this.size = Math.random() * 10 + 5;
                this.color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 10;
                this.gravity = 0.5;
                this.drag = 0.95;
            }
            update() {
                this.vx *= this.drag;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
            }
            draw() {
                ctxConfetti.save();
                ctxConfetti.translate(this.x, this.y);
                ctxConfetti.rotate(this.rotation * Math.PI / 180);
                ctxConfetti.fillStyle = this.color;
                ctxConfetti.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctxConfetti.restore();
            }
        }

        let animationId = null;

        function shootConfetti() {
            confettis = [];
            for (let i = 0; i < 150; i++) {
                confettis.push(new Confetti());
            }
            
            if (animationId) cancelAnimationFrame(animationId);
            animateConfetti();
        }

        function animateConfetti() {
            ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            let active = false;
            confettis.forEach(c => {
                c.update();
                c.draw();
                if (c.y < window.innerHeight) active = true;
            });
            
            if (active) {
                animationId = requestAnimationFrame(animateConfetti);
            } else {
                ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }
    </script>
</body>
</html>
